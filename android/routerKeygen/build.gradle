plugins {
    id 'com.android.application'
}

android {
    namespace 'org.exobel.routerkeygen'
    compileSdk 36

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId "org.exobel.routerkeygen"
        versionCode 43
        versionName "4.1.0"
        minSdk 28
        targetSdk 36
        multiDexEnabled false

        externalNativeBuild {
            ndkBuild {
                // Passes an optional argument to ndk-build.
                arguments "V=1"
                // Specifies the ABI configurations of your native
                // libraries Gradle should build and package with your APK.
                abiFilters 'x86', 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    flavorDimensions "tier"
    productFlavors {
        github {
            dimension "tier"
            applicationId "org.exobel.routerkeygen"
        }
        googleplay {
            dimension "tier"
            applicationId "io.github.routerkeygen"
        }
    }


    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }
    lint {
        abortOnError false
    }
}

// Map for the version code that gives each ABI a value.
ext.abiCodes = ['arm64-v8a': 1, 'armeabi': 2, x86: 3, 'armeabi-v7a': 4]

// For per-density APKs, create a similar map like this:
// ext.densityCodes = ['mdpi': 1, 'hdpi': 2, 'xhdpi': 3]

import com.android.build.api.variant.FilterConfiguration

// For each APK output variant, override versionCode with a combination of
// ext.abiCodes * 1000 + output.versionCode.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType == FilterConfiguration.FilterType.ABI }?.identifier
            def baseAbiVersionCode = project.ext.abiCodes.get(abi)
            if (baseAbiVersionCode != null) {
                output.versionCode.set(output.versionCode.map { versionCode -> baseAbiVersionCode * 1000 + versionCode })
            }
        }
    }
}


dependencies {
    implementation project(':aFileChooser')
    implementation(name: 'android-ad-sdk', ext: 'aar')

    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation('com.google.android.gms:play-services-location:21.4.0', {
        exclude group: 'com.android.support'
    })
    implementation('com.google.android.gms:play-services-analytics:18.1.1', {
        exclude group: 'com.android.support'
    })
    implementation('ch.acra:acra:4.11.1', { exclude group: 'com.android.support' })
    testImplementation 'junit:junit:4.13.2'
}

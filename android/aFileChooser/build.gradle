plugins {
    id 'com.android.library'
}

android {
    namespace 'com.ipaulpro.afilechooser'
    compileSdk 36

    defaultConfig {
        minSdk 28
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }
}